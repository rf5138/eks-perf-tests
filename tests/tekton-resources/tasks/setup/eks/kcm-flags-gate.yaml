apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: kcm-flags-gate
  namespace: scalability
spec:
  description: |
    Holds a pipeline after cluster setup so an operator can change KCM flags (for example the
    --concurrent-*-syncs worker counts) on the control plane before the loads start.
    Optionally gives an operator IAM role cluster-admin access to the test cluster, then waits
    until the object at gate-uri exists in S3. Fails after timeout-minutes, so finally teardown runs.
  params:
  - name: cluster-name
    description: The name of the EKS cluster
  - name: endpoint
    description: EKS endpoint, empty for the default
    default: ""
  - name: region
    default: "us-west-2"
  - name: operator-role-arn
    description: IAM role to grant AmazonEKSClusterAdminPolicy on the test cluster; empty grants nothing
    default: ""
  - name: gate-uri
    description: s3://bucket/key the operator writes when the flags are set; its content is printed
  - name: timeout-minutes
    default: "240"
  steps:
  - name: grant-operator-access
    image: amazon/aws-cli
    script: |
      #!/bin/bash
      set -euo pipefail
      [ -n "$(params.operator-role-arn)" ] || { echo "no operator role, skipping"; exit 0; }
      EP=""; [ -z "$(params.endpoint)" ] || EP="--endpoint-url $(params.endpoint)"
      aws eks $EP --region $(params.region) create-access-entry --cluster-name $(params.cluster-name) \
        --principal-arn "$(params.operator-role-arn)" 2>&1 | grep -v ResourceInUse || true
      aws eks $EP --region $(params.region) associate-access-policy --cluster-name $(params.cluster-name) \
        --principal-arn "$(params.operator-role-arn)" \
        --policy-arn arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy \
        --access-scope type=cluster
  - name: wait-for-gate
    image: amazon/aws-cli
    script: |
      #!/bin/bash
      set -uo pipefail
      deadline=$(( $(date +%s) + $(params.timeout-minutes) * 60 ))
      echo "waiting for $(params.gate-uri)"
      until aws s3 cp "$(params.gate-uri)" - 2>/dev/null; do
        [ "$(date +%s)" -lt "$deadline" ] || { echo "gate not opened in $(params.timeout-minutes) min" >&2; exit 1; }
        sleep 30
      done
      echo; echo "gate open"
