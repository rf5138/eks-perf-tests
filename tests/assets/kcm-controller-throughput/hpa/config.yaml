{{$namespaces := DefaultParam .CL2_NAMESPACES 50}}
{{$hpaPerNamespace := DefaultParam .CL2_OBJECTS_PER_NAMESPACE 100}}
{{$setupQps := DefaultParam .CL2_SETUP_QPS 100}}
{{$waves := DefaultParam .CL2_WAVES 10}}
{{$settle := DefaultParam .CL2_SETTLE "5m"}}
{{$setupTimeout := DefaultParam .CL2_SETUP_TIMEOUT "20m"}}
{{$waveTimeoutSeconds := DefaultParam .CL2_WAVE_TIMEOUT_SECONDS 600}}
{{$podsTimeout := DefaultParam .CL2_PODS_TIMEOUT "15m"}}

{{$HPA_THROUGHPUT_THRESHOLD := DefaultParam .CL2_THROUGHPUT_THRESHOLD 1}}

# 5,000 Deployments of 1 pod on the KWOK nodes, each with an HPA on one External metric that a fake metrics API serves
# (hpa-metrics.sh, fake-metrics-server.py). The HPA wants ceil(replicas x value / 100) replicas between 1 and 3. Each
# half-wave sets the value once: up sets 300 (every HPA wants 3), down sets 30 (every HPA wants 1; 100 would change
# nothing). The HPA controller picks the new value up at its next sync of each HPA (every 15 s), so the fastest
# half-wave is about 15 s.
# Gate: timed from the start of the set step (hpa-metrics.sh writes the start time), hpa-wait.py fails a half-wave in
# which not every HPA has status.desiredReplicas equal to the new count within totalHPAs/threshold seconds, and keeps
# waiting up to waveTimeoutSeconds; a half-wave still not reconciled by then also fails, and the next one starts on top of it. This times the HPA controller alone. The Deployment and ReplicaSet
# controllers then create or delete the pods, and the next step waits for them with only the ceiling podsTimeout, so the
# next half-wave starts reconciled. Threshold 1 leaves only the ceilings (record only). The setup wait is fatal.
# The Exec steps run from CL2's working directory, perf-tests/clusterloader2 (kcm-controller-throughput Task).
{{$assets := "../../kubernetes-iteration-toolkit/tests/assets/kcm-controller-throughput/hpa"}}
{{$startFile := "/tmp/kcm-hpa-wave-start"}}
{{$totalHPAs := MultiplyInt $namespaces $hpaPerNamespace}}
{{$reconcileLimit := MaxFloat 1 (DivideFloat $totalHPAs $HPA_THROUGHPUT_THRESHOLD)}}

name: hpa-throughput
namespace:
  number: {{$namespaces}}
tuningSets:
- name: Setup
  qpsLoad:
    qps: {{$setupQps}}
steps:
- name: Install fake metrics API
  measurements:
  - Identifier: InstallFakeMetrics
    Method: Exec
    Params:
      command: ["bash", "{{$assets}}/hpa-metrics.sh", "install"]
      timeout: 10m
- name: Create Deployments
  phases:
  - namespaceRange:
      min: 1
      max: {{$namespaces}}
    replicasPerNamespace: {{$hpaPerNamespace}}
    tuningSet: Setup
    objectBundle:
    - basename: hpa-target
      objectTemplatePath: deployment.yaml
- name: Wait for setup pods
  measurements:
  - Identifier: WaitForSetupPods
    Method: WaitForRunningPods
    Params:
      desiredPodCount: {{$totalHPAs}}
      labelSelector: group = hpa-test
      timeout: {{$setupTimeout}}
      isFatal: true
- name: Create HPAs
  phases:
  - namespaceRange:
      min: 1
      max: {{$namespaces}}
    replicasPerNamespace: {{$hpaPerNamespace}}
    tuningSet: Setup
    objectBundle:
    - basename: hpa-target
      objectTemplatePath: hpa.yaml
- name: Settle before load
  measurements:
  - Identifier: Settle
    Method: Sleep
    Params:
      duration: {{$settle}}
{{range $i := Loop $waves}}
{{range $dir := StringSplit "up,down"}}
{{$replicas := IfThenElse (eq $dir "up") 3 1}}
- name: Scale {{$dir}} wave {{$i}}
  measurements:
  - Identifier: Set{{$i}}{{$dir}}
    Method: Exec
    Params:
      command: ["bash", "{{$assets}}/hpa-metrics.sh", "set", "{{IfThenElse (eq $dir "up") 300 30}}", "{{$startFile}}"]
      timeout: 5m
- name: Reconcile wave {{$i}} {{$dir}}
  measurements:
  - Identifier: Wave{{$i}}{{$dir}}
    Method: Exec
    Params:
      command: ["python3", "{{$assets}}/hpa-wait.py", "{{$totalHPAs}}", "{{$replicas}}", "{{$reconcileLimit}}", "{{$waveTimeoutSeconds}}", "{{$startFile}}"]
      timeout: {{AddInt $waveTimeoutSeconds 60}}s
- name: Pods of wave {{$i}} {{$dir}}
  measurements:
  - Identifier: Pods{{$i}}{{$dir}}
    Method: WaitForRunningPods
    Params:
      desiredPodCount: {{MultiplyInt $totalHPAs $replicas}}
      labelSelector: group = hpa-test
      refreshInterval: 1s
      timeout: {{$podsTimeout}}
{{end}}
{{end}}
- name: Delete test objects
  phases:
  - namespaceRange:
      min: 1
      max: {{$namespaces}}
    replicasPerNamespace: 0
    tuningSet: Setup
    objectBundle:
    - basename: hpa-target
      objectTemplatePath: hpa.yaml
    - basename: hpa-target
      objectTemplatePath: deployment.yaml
- name: Remove fake metrics API
  measurements:
  - Identifier: RemoveFakeMetrics
    Method: Exec
    Params:
      command: ["bash", "{{$assets}}/hpa-metrics.sh", "remove"]
      timeout: 5m
