# The HPA of the Deployment with the same name. It reads one External metric of type Value with target 100, so it
# wants ceil(current replicas x value / 100) replicas, between 1 and 3 (hpa-metrics.sh sets the value). Both
# stabilization windows are 0 so a scale-down is not held back for 5 minutes, and the policies allow 1 to 3 and
# back in one sync.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{.Name}}
  labels:
    group: hpa-test
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{.Name}}
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: External
    external:
      metric:
        name: loadtest
      target:
        type: Value
        value: "100"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Pods
        value: 10
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 0
      policies:
      - type: Pods
        value: 10
        periodSeconds: 15
